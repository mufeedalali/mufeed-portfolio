<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>RAG Document Assistant</h1>
                <p class="subtitle">Ask questions about your documents</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <div class="sidebar">
                <!-- Document Upload Section -->
                <section class="panel">
                    <h2>Documents</h2>

                    <div class="upload-area" id="uploadArea">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Drop documents here or click to upload</p>
                        <input type="file" id="fileInput" multiple style="display: none;" accept=".pdf,.docx,.txt,.csv,.md">
                    </div>

                    <div id="documentList" class="document-list">
                        <p class="empty-state">No documents yet</p>
                    </div>
                </section>

                <!-- Settings Section -->
                <section class="panel">
                    <h2>Settings</h2>

                    <label class="setting">
                        <span>Top Results</span>
                        <input type="number" id="topK" value="5" min="1" max="20">
                    </label>

                    <label class="setting">
                        <span>LLM Provider</span>
                        <select id="llmProvider">
                            <option value="mock">Mock (Offline)</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </label>

                    <label class="setting">
                        <span>Temperature</span>
                        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                        <span id="tempValue">0.7</span>
                    </label>
                </section>
            </div>

            <!-- Chat Area -->
            <section class="chat-panel">
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant-message">
                        <div class="message-content">
                            <p>Hello! I'm your AI Document Assistant. Upload documents and ask me questions about them.</p>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <form class="chat-input-form" id="chatForm">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="queryInput"
                            placeholder="Ask a question about your documents..."
                            autocomplete="off"
                        >
                        <button type="submit" class="send-button">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16107292 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99701575 L3.03521743,10.4380088 C3.03521743,10.5951061 3.34915502,10.7522035 3.50612381,10.7522035 L16.6915026,11.5376905 C16.6915026,11.5376905 17.1624089,11.5376905 17.1624089,12.0089827 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="input-hints" id="inputHints"></div>
                </form>
            </section>
        </main>
    </div>

    <!-- Loading Spinner -->
    <div class="spinner" id="spinner" style="display: none;"></div>

    <!-- Error Toast -->
    <div class="toast" id="errorToast" style="display: none;"></div>

    <script src="/static/app.js"></script>
</body>
</html>
