# Setup configuration for the RAG Pipeline package

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "1.0.0"
description = "Production-ready RAG Pipeline for AI Document Assistant"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.0",
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
embeddings = ["sentence-transformers>=2.2.2"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/rag-pipeline"
Documentation = "https://github.com/example/rag-pipeline/blob/main/README.md"
Repository = "https://github.com/example/rag-pipeline"
Issues = "https://github.com/example/rag-pipeline/issues"

[tool.setuptools]
packages = ["app", "cli"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
